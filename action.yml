name: 'Build and Install bgfx'
description: 'Set up and compile bgfx once so it can be reused across different workflows.'

inputs:
  bgfx-version:
    description: 'The tag or branch of bgfx.cmake to clone'
    required: false
    default: 'v1.172.9657-621'
  cache:
    description: 'Whether to cache the installation'
    required: false
    default: 'true'
  cache-key-prefix:
    description: 'Prefix for the cache key'
    required: false
    default: 'bgfx-install'
  build-type:
    description: 'The CMAKE_BUILD_TYPE (e.g. Release, Debug)'
    required: false
    default: 'Release'
  force-build:
    description: 'Force building bgfx from source instead of downloading prebuilt release if available'
    required: false
    default: 'false'
  cmake-args:
    description: 'Extra arguments to pass to CMake during configuration'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Get OS Info
      id: os-info
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          if [ -f /etc/os-release ]; then
            source /etc/os-release
            echo "os_id=${ID}-${VERSION_ID}" >> $GITHUB_OUTPUT
          else
            echo "os_id=linux" >> $GITHUB_OUTPUT
          fi
        elif [ "$RUNNER_OS" == "macOS" ]; then
          echo "os_id=macos-$(sw_vers -productVersion | cut -d. -f1)" >> $GITHUB_OUTPUT
        else
          echo "os_id=windows" >> $GITHUB_OUTPUT
        fi

    - name: Cache bgfx
      id: cache-bgfx
      if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/bgfx-install
        key: ${{ inputs.cache-key-prefix }}-${{ steps.os-info.outputs.os_id }}-${{ runner.arch }}-${{ inputs.bgfx-version }}-${{ inputs.build-type }}-${{ inputs.force-build }}

    - name: Download Precompiled Release
      id: download-bgfx
      if: |
        inputs.force-build != 'true' &&
        inputs.build-type == 'Release' &&
        (inputs.cache != 'true' || steps.cache-bgfx.outputs.cache-hit != 'true')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if command -v python3 &>/dev/null; then
          PYTHON_BIN="python3"
        else
          PYTHON_BIN="python"
        fi
        "$PYTHON_BIN" "${{ github.action_path }}/scripts/download_release.py" \
          --version "${{ inputs.bgfx-version }}" \
          --install-dir "${{ github.workspace }}/bgfx-install" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}"

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux' && (inputs.cache != 'true' || steps.cache-bgfx.outputs.cache-hit != 'true') && steps.download-bgfx.outputs.installed != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libgl1-mesa-dev x11proto-core-dev libx11-dev \
            libwayland-dev wayland-protocols libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS' && (inputs.cache != 'true' || steps.cache-bgfx.outputs.cache-hit != 'true') && steps.download-bgfx.outputs.installed != 'true'
      shell: bash
      run: |
        brew install ninja

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows' && (inputs.cache != 'true' || steps.cache-bgfx.outputs.cache-hit != 'true') && steps.download-bgfx.outputs.installed != 'true'
      shell: bash
      run: |
        choco install ninja

    - name: Clone bgfx
      if: (inputs.cache != 'true' || steps.cache-bgfx.outputs.cache-hit != 'true') && steps.download-bgfx.outputs.installed != 'true'
      shell: bash
      run: |
        git clone --recursive https://github.com/bkaradzic/bgfx.cmake.git -b ${{ inputs.bgfx-version }} bgfx-build

    - name: Configure and Build bgfx
      if: (inputs.cache != 'true' || steps.cache-bgfx.outputs.cache-hit != 'true') && steps.download-bgfx.outputs.installed != 'true'
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        cd bgfx-build
        
        WORKSPACE_PATH="${WORKSPACE//\\//}"

        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} -DBGFX_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$WORKSPACE_PATH/bgfx-install" ${{ inputs.cmake-args }}
        cmake --build build --config ${{ inputs.build-type }} --target install

    - name: Set CMAKE_PREFIX_PATH
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        WORKSPACE_PATH="${WORKSPACE//\\//}"
        if [ "$RUNNER_OS" == "Windows" ]; then
          SEP=";"
        else
          SEP=":"
        fi
        if [ -n "${CMAKE_PREFIX_PATH}" ]; then
          echo "CMAKE_PREFIX_PATH=${WORKSPACE_PATH}/bgfx-install${SEP}${CMAKE_PREFIX_PATH}" >> $GITHUB_ENV
        else
          echo "CMAKE_PREFIX_PATH=${WORKSPACE_PATH}/bgfx-install" >> $GITHUB_ENV
        fi
